# Render Infrastructure-as-Code Blueprint
services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: fastapi-social-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_HOSTNAME
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

  # 2. React Static Site Frontend
  - type: web
    name: fastapi-social-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fastapi-social-backend
          property: url
